# This workflow will build a golang project and run comprehensive tests
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:

  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: db_cache_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Setup test database
      run: |
        PGPASSWORD=testpass psql -h localhost -p 5433 -U testuser -d db_cache_test -f test/init/01-init.sql
        PGPASSWORD=testpass psql -h localhost -p 5433 -U testuser -d db_cache_test -f test/init/02-sample-data.sql

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -v ./...

    - name: Run comprehensive tests
      run: |
        cd pkg/db-cache
        go test -v -race -cover -coverprofile=coverage.out

