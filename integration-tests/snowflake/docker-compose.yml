version: '3.8'

services:
  # Note: Snowflake doesn't have a local Docker container
  # This file is kept for consistency but tests will use environment variables
  # to connect to a real Snowflake instance or be skipped if not configured
  
  # For testing, you can use environment variables:
  # SNOWFLAKE_ACCOUNT=your-account
  # SNOWFLAKE_USER=your-user
  # SNOWFLAKE_PASSWORD=your-password
  # SNOWFLAKE_DATABASE=your-database
  # SNOWFLAKE_SCHEMA=your-schema
  
  # Or set SKIP_SNOWFLAKE_TESTS=true to skip Snowflake tests
